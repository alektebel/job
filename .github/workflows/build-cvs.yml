name: Build CVs

on:
  push:
    paths:
      - "src/**"
      - "Makefile"
      - ".github/workflows/build-cvs.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile all CV variants
        uses: xu-cheng/latex-action@v3
        with:
          root_file: src/cv_*.tex
          glob_root_file: true
          work_in_root_file_dir: true
          latexmk_use_lualatex: false

      - name: Collect PDFs
        run: |
          mkdir -p out
          cp src/*.pdf out/

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: out/*.pdf
          if-no-files-found: error
